<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="../assets/images/iconeLivro.png"
      type="image/x-icon"
    />
    <script type="module" src="../dashboard/dashboard.js" defer></script>
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../dashboard/dashboard.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Honk:MORF@15&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js"
      integrity="sha512-QoJS4DOhdmG8kbbHkxmB/rtPdN62cGWXAdAFWWJPvUFF1/zxcPSdAnn4HhYZSIlVoLVEJ0LesfNlusgm2bPfnA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <title>Biblioteca Digital</title>
  </head>
  <body>
    <header class="containerCabecalho">
      <div class="cabecalhoEsquerdo">
        <img
          src="../assets/images/iconeLivro.png"
          alt="imagem livro aberto"
          class="imgCabecalho"
        />
        <h1>Biblioteca Digital</h1>
      </div>
      <div class="cabecalhoDireito">
        <img
          src="../assets/images/user.svg"
          alt="imagem usuario"
          srcset=""
          class="imgUsuario"
        />
        <h3 class="nomeUsuario"></h3>
      </div>
    </header>
    <main class="container">
      <aside>
        <nav class="navegar">
          <ul>
            <li id="dashboard">
              <img
                src="../assets/images/home.svg"
                alt="imagem de casa"
              />Dashboard
            </li>
            <li id="cadastro">
              <img
                src="../assets/images/cadUser.svg"
                alt="imagem contatos"
              />Cadastro de Usuários
            </li>
            <li id="cadastro">
              <img
                src="../assets/images/cadLivro.svg"
                alt="imagem contatos"
              />Cadastro de Livros
            </li>
            <li id="menuLateralCursos">
              <img
                src="../assets/images/emprLivro.svg"
                alt="imagem livro"
              />Realizar Empréstimo
            </li>
            <li id="menuLateralDevolucao">
              <img
                src="../assets/images/devoLivro.svg"
                alt="imagem livro"
              />Realizar Devolução
            </li>
            <li id="sair">
              <img
                src="../assets/images/sair.svg"
                alt="imagem de porta"
              />Sair
            </li>
          </ul>
        </nav>
      </aside>
      <section id="painelCursos">
        <div class="conteudoContador">
          <section id="totalCursos"></section>
        </div>
        <span class="textoSpan"></span>
        <div class="painelCardCursos">
          <section id="cursosUsuario"></section>
        </div>
        <div class="erroCursos"></div>
      </section>
    </main>
  </body>
</html>
