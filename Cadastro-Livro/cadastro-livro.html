<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="../assets/images/favicon.jfif"
      type="image/x-icon"
    />
    <script
      type="module"
      src="../Cadastro-Livro/cadastro-livro.js"
      defer
    ></script>
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../Cadastro-Livro/cadastro-livro.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Honk:MORF@15&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js"
      integrity="sha512-QoJS4DOhdmG8kbbHkxmB/rtPdN62cGWXAdAFWWJPvUFF1/zxcPSdAnn4HhYZSIlVoLVEJ0LesfNlusgm2bPfnA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>Bibliioteca Digital</title>
  </head>
  <body>
    <header class="containerCabecalho">
      <div class="cabecalhoEsquerdo">
        <img
          src="../assets/images/iconeLivro.png"
          alt="imagem biblioteca digital"
          class="imgCabecalho"
        />
        <h1>Biblioteca Digital</h1>
      </div>
      <div class="cabecalhoDireito">
        <img
          src="../assets/images/user.svg"
          alt="imagem usuario"
          srcset=""
          class="imgUsuario"
        />
        <h3 class="nomeUsuario"></h3>
      </div>
    </header>
    <main class="container">
      <aside>
        <nav class="navegar">
          <ul>
            <li id="dashboard">
              <img
                src="../assets/images/home.svg"
                alt="imagem de casa"
              />Dashboard
            </li>
            <li id="cadastro">
              <img
                src="../assets/images/cadUser.svg"
                alt="imagem contatos"
              />Cadastro de Usuários
            </li>
            <li id="cadastroLivro">
              <img
                src="../assets/images/cadLivro.svg"
                alt="imagem contatos"
              />Cadastro de Livros
            </li>
            <li id="listarLivro">
              <img
                src="../assets/images/listarLivros.svg"
                alt="imagem contatos"
              />Listar Livros
            </li>
            <li id="menuLateralCursos">
              <img
                src="../assets/images/emprLivro.svg"
                alt="imagem livro"
              />Realizar Empréstimo
            </li>
            <li id="menuLateralDevolucao">
              <img
                src="../assets/images/devoLivro.svg"
                alt="imagem livro"
              />Realizar Devolução
            </li>
            <li id="sair">
              <img src="../assets/images/sair.svg" alt="imagem de porta" />Sair
            </li>
          </ul>
        </nav>
      </aside>
      <section class="sectionForm">
        <h1>Cadastro Livro</h1>
        <form class="formContainer">
          <fieldset>
            <legend>Dados do Livro</legend>
            <!-- <h3>Dados Pessoais</h3> -->
            <div class="linhaGrid">
              <div class="campoForm">
                <label for="nome">Titulo</label>
                <input
                  type="text"
                  id="nome"
                  placeholder="Digite o nome do titulo"
                  autocomplete="name"
                  maxlength="80"
                  minlength="4"
                  required
                />
                <span class="obrigatorio"></span>
              </div>
              <div class="campoForm">
                <label for="nomeAutor">Autor</label>
                <input
                  type="text"
                  id="nomeAutor"
                  placeholder="Digite o nome do autor"
                  autocomplete="name"
                  maxlength="80"
                  minlength="4"
                  required
                />
                <span class="autorObrigatorio"></span>
              </div>
              <div class="campoForm">
                <label for="categoria">Categoria</label>
                <select name="categorias" id="categoria" required>
                  <option value="">Selecione</option>
                  <option value="Prog">Programação</option>
                  <option value="WebD">Web Design</option>
                  <option value="BD">Banco de Dados</option>
                  <option value="Ferramentas">Ferramentas</option>
                  <option value="Design">Design</option>
                </select>
              </div>
            </div>
            <div class="linhaGrid duasColunas">
              <div class="campoForm">
                <label for="nPaginas">Numero de Páginas</label>
                <input type="number" id="nPaginas" placeholder="0000" required />
              </div>
            </div>
            <div class="containerBtn">
              <button type="button" class="btnSalvar">Salvar</button>
            </div>
          </fieldset>
        </form>
      </section>
    </main>
  </body>
</html>
